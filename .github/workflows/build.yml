name: Compilar APK

on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/escola.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/escola.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo KEYSTORE_BASE64 não encontrado. O APK será assinado com chave de teste e NÃO poderá ser atualizado por cima depois."
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Guardar o APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: EscolaNuklear-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
